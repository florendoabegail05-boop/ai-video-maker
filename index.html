<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Video Maker</title>

  <link rel="stylesheet" href="./style.css">
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f6f7fb;
  color: #202124;
  min-height: 100vh;
}

.topbar {
  height: 70px;
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
}

.logo {
  font-size: 21px;
  font-weight: 700;
}

.status {
  font-size: 12px;
  font-weight: 700;
  background: #e8f5e9;
  color: #2e7d32;
  padding: 7px 12px;
  border-radius: 20px;
}

.container {
  width: min(1100px, 92%);
  margin: 0 auto;
  padding: 55px 0 80px;
}

.hero {
  text-align: center;
  margin-bottom: 35px;
}

.hero h1 {
  font-size: 52px;
  margin-bottom: 14px;
  letter-spacing: -1px;
}

.hero p {
  color: #6b7280;
  font-size: 17px;
}

.creator-card,
.results {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 18px;
  padding: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,.05);
}

.creator-card h2 {
  margin-bottom: 24px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}

textarea,
select {
  width: 100%;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  padding: 13px;
  font-size: 15px;
  background: #fff;
}

textarea {
  min-height: 130px;
  resize: vertical;
  margin-bottom: 24px;
}

.settings {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 25px;
}

button {
  width: 100%;
  border: none;
  border-radius: 11px;
  padding: 15px 20px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  background: #111827;
  color: #fff;
}

.results {
  margin-top: 30px;
}

.hidden {
  display: none;
}

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
}

.result-header p {
  color: #6b7280;
  margin-top: 6px;
}

.score {
  min-width: 80px;
  height: 80px;
  border: 5px solid #111827;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  font-weight: 800;
}

.result-section {
  border-top: 1px solid #e5e7eb;
  padding: 25px 0;
}

.result-section h3 {
  margin-bottom: 12px;
}

.result-section p {
  color: #4b5563;
  line-height: 1.7;
}

.scene {
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 18px;
  margin-top: 14px;
  background: #fafafa;
}

.scene strong {
  display: block;
  margin-top: 12px;
  font-size: 13px;
}

.publishing {
  display: grid;
  gap: 20px;
}

.publishing div {
  padding: 16px;
  border-radius: 10px;
  background: #f9fafb;
}

.secondary {
  background: #fff;
  color: #111827;
  border: 1px solid #d1d5db;
}

footer {
  text-align: center;
  color: #9ca3af;
  font-size: 13px;
  padding: 25px;
}

@media (max-width: 700px) {
  .settings {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    font-size: 36px;
  }
}
</style>
</head>

<body>

  <header class="topbar">
    <div class="logo">🎬 AI Video Maker</div>
    <div class="status">FREE MVP</div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>Turn an idea into a video.</h1>

      <p>
        Create scripts, scenes, prompts and production plans
        with one click.
      </p>
    </section>

    <section class="creator-card">

      <h2>✨ One-Click Creator</h2>

      <label for="idea">
        What do you want to create?
      </label>

      <textarea
        id="idea"
        placeholder="Example: A baby bear discovers the colors of the rainbow..."
      ></textarea>

      <div class="settings">

        <div>
          <label for="type">Video Type</label>

          <select id="type">
            <option>YouTube Short</option>
            <option>TikTok</option>
            <option>Instagram Reel</option>
            <option>Educational Video</option>
            <option>Story Video</option>
          </select>
        </div>

        <div>
          <label for="length">Length</label>

          <select id="length">
            <option value="30">30 seconds</option>
            <option value="45">45 seconds</option>
            <option value="60">60 seconds</option>
          </select>
        </div>

        <div>
          <label for="style">Style</label>

          <select id="style">
            <option>Kids 3D Animation</option>
            <option>Cartoon</option>
            <option>Storybook</option>
            <option>Educational</option>
            <option>Cinematic</option>
          </select>
        </div>

      </div>

      <button onclick="createVideo()">
        ✨ CREATE VIDEO
      </button>

    </section>

    <section id="results" class="results hidden">

      <div class="result-header">

        <div>
          <h2>Your Video Blueprint</h2>
          <p id="videoSummary"></p>
        </div>

        <div class="score">
          <span id="score">--</span>
          <small>/100</small>
        </div>

      </div>

      <div class="result-section">

        <h3>🎯 Hook</h3>

        <p id="hook"></p>

      </div>

      <div class="result-section">

        <h3>📝 Script</h3>

        <p id="script"></p>

      </div>

      <div class="result-section">

        <h3>🎬 Scenes</h3>

        <div id="scenes"></div>

      </div>

      <div class="result-section">

        <h3>📱 Publishing Package</h3>

        <div class="publishing">

          <div>
            <strong>Title</strong>
            <p id="title"></p>
          </div>

          <div>
            <strong>Description</strong>
            <p id="description"></p>
          </div>

          <div>
            <strong>Hashtags</strong>
            <p id="hashtags"></p>
          </div>

        </div>

      </div>

      <button class="secondary" onclick="makeMore()">
        ♻️ MAKE 10 MORE IDEAS
      </button>
<button class="secondary" onclick="downloadBlueprint()">
  📥 DOWNLOAD BLUEPRINT
</button>      

    </section>

  </main>

  <footer>
    AI Video Maker — Free MVP
  </footer>

  <script src="app.js"></script>

</body>
</html>
