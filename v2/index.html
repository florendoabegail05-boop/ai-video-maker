<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://127.0.0.1:8787; object-src 'none'; base-uri 'none'"><title>AI Video Maker V2</title><link rel="stylesheet" href="studio.css"><script type="module" src="studio.mjs"></script></head><body><header><strong>✦ AI Video Maker V2</strong><span>FREE ONLY · local planning</span><a href="../index.html">V1 studio</a></header><main><section class="hero"><p>V2 CLEAN STUDIO</p><h1>One idea, a scene plan you can control.</h1><p>Build a continuity-aware storyboard and revise only the scene that needs work. Import local media files and export each one. Media generation is not connected yet.</p></section><section class="grid"><aside><h2>Projects</h2><label>Restore project JSON<input id="restore" type="file" accept=".json,application/json"></label><div id="projects"></div></aside><article><label>Project name<input id="name" maxlength="80" placeholder="My video"></label><label>Your video idea<textarea id="prompt" rows="5" placeholder="Describe the story, characters, location and outcome"></textarea></label><div class="row"><label>Visual direction<select id="style"><option>photorealistic</option><option>cinematic</option><option>3D animation</option><option>storybook</option><option>fantasy</option><option>sci-fi</option><option>surreal</option><option selected>custom</option></select></label><label>Hardware mode<select id="hardware"><option value="light">Light laptop (default)</option><option value="balanced">Balanced</option><option value="strong">Stronger laptop</option></select></label><label>Duration<select id="seconds"><option>15</option><option selected>30</option><option>45</option><option>60</option></select></label></div><div class="actions"><button id="plan">Create scene plan</button><button id="export" disabled>Export project metadata JSON</button><button id="undo" type="button" disabled>Undo last change</button><button id="bridge" type="button">Check local bridge</button></div><p id="notice" role="status"></p><div id="summary"></div><div class="row"><label>Optional local audio<select id="audioRole"><option value="music">Music / ambience</option><option value="voice">Voice track</option></select></label><label>Import audio<input id="audioFile" type="file" accept=".wav,.mp3,.m4a,.ogg,.flac,audio/*"></label></div><div id="audioAssets"></div><div class="actions"><button id="createDraft" type="button">Create draft video</button><button id="assemble" type="button">Assemble final MP4</button><div id="finalVideo"></div></div><div id="preview" aria-live="polite"></div><div id="scenes"></div></article></section></main></body></html>
