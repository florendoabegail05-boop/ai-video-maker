name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Verify required app files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f SECURITY.md
      - name: Security smoke checks
        run: |
          ! grep -RniE '(api[_-]?key|secret|password|token)\\s*[:=]\\s*["'"'][^"'"']+["'"']' --exclude-dir=.git --exclude='*.md' .
          ! grep -RniE 'http://|https://' app.js styles.css index.html
