name: CI

on:
  push:
    branches: [main, 'feature/**', 'qa/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Quality Director smoke tests
        run: node tests/quality-engine.smoke.js
      - name: Future-proof foundation smoke tests
        run: node tests/future-proof.smoke.js
      - name: Generation orchestrator smoke tests
        run: node tests/generation-orchestrator.smoke.js
      - name: Verify required app files
        run: |
          test -f index.html
          test -f style.css
          test -f quality.css
          test -f pipeline.css
          test -f app-config.js
          test -f provider-registry.js
          test -f generation-contract.js
          test -f generation-orchestrator.js
          test -f provider-adapters.js
          test -f story-engine.js
          test -f media-assembly.js
          test -f app.js
          test -f quality-engine.js
          test -f production-pipeline.js
          test -f register-sw.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f SECURITY.md
          test -f ARCHITECTURE.md
          test -f tests/quality-engine.smoke.js
          test -f tests/future-proof.smoke.js
          test -f tests/generation-orchestrator.smoke.js
      - name: Verify local-first frontend
        run: |
          if grep -RniE 'api[_-]?key|client[_-]?secret|access[_-]?token' --exclude-dir=.git --exclude='*.md' .; then exit 1; fi
          if grep -nE 'https?://' *.js; then exit 1; fi
      - name: Verify strict CSP
        run: |
          grep -q "Content-Security-Policy" index.html
          grep -q "connect-src 'none'" index.html
          grep -q "frame-ancestors 'none'" index.html
